# Countdown lock screen config. Edit this file, then re-run make_lockscreen.py.
# Avoid em dashes in any text below; it is shown on the image.

deadline:
  title: "Send 15 job applications"
  target: "2026-12-15 17:00"      # local time in the timezone below
  timezone: "Asia/Jakarta"        # WIB, UTC+7

# Progress indicator: one segment per application.
# Bump `current` as you send applications and re-render.
progress:
  label: "SENT"
  current: 0
  total: 15

# Dated in order, ending on the deadline. Planned with Gemini on 2026-11-23.
# Keep titles short (they must fit on a phone).
milestones:
  - date: 2026-11-29
    title: "Finish CV, GitHub, cover letter"
    done_when: "Resume PDF exported, READMEs polished, cover letter base ready"
  - date: 2026-12-03
    title: "Shortlist 25 target roles"
    done_when: "25 high-fit roles in a tracker with links and deadlines"
  - date: 2026-12-06
    title: "Submit first 4 applications"
    done_when: "4 tailored applications sent at 45 to 60 min each"
  - date: 2026-12-10
    title: "Reach 8 of 15 apps sent"
    done_when: "8 applications sent, no drafts left open"
  - date: 2026-12-13
    title: "Reach 12 of 15 apps sent"
    done_when: "12 sent after a 4-app weekend push"
  - date: 2026-12-15
    title: "Submit final 3 apps (15/15)"
    done_when: "15 sent by 17:00 WIB, confirmations archived, tracker logged"

style:
  background: "#0B0F12"
  background_glow: "#0F2A2A"      # soft radial glow behind the countdown; set equal to background to disable
  text: "#E8EEF0"
  muted: "#7C8A90"
  faint: "#2A3338"
  accent: "#2DD4BF"               # teal
  # Fonts are tried in order; system fonts only, nothing is downloaded.
  fonts:
    - path: "/System/Library/Fonts/SFNSMono.ttf"   # variable font (macOS)
      regular: "Regular"
      bold: "Bold"
    - path: "/System/Library/Fonts/Menlo.ttc"
      regular_index: 0
      bold_index: 1
    - path: "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"
      bold_path: "/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf"

outputs:
  - name: "lockscreen_iphone_1179x2556"
    size: [1179, 2556]
    kind: phone
  - name: "lockscreen_android_1080x2400"
    size: [1080, 2400]
    kind: phone
  - name: "lockscreen_desktop_2560x1440"
    size: [2560, 1440]
    kind: desktop

safe_zone:
  phone_top: 0.30       # keep clear for the system clock
  phone_bottom: 0.12    # keep clear for flashlight / camera / home bar
  desktop_top: 0.30     # macOS lock screen clock
  desktop_bottom: 0.18  # login field / user picture
